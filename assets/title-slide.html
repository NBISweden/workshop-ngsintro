<section id="$idprefix$title-slide" $for(title-slide-attributes/pairs)$ $it.key$="$it.value$" $endfor$>
  <div class="title-container">

    <div class="title-parent $if(hero)$title-two$else$title-one$endif$">
      <div class="title-child-text">
        <h1 class="title">$title$</h1>
        $if(subtitle)$
        <p class="subtitle">$subtitle$</p>
        $endif$
        $for(by-author)$
        <p class="author">$by-author.name.literal$$for(by-author.affiliations)$
          <span class="affiliation">$it.name$</span>$endfor$</p>
        $endfor$
        $if(by-author)$
        $else$
        $for(institute)$
        <p class="institute">$institute$</p>
        $endfor$
        $endif$
        $if(date)$
        <p class="date">$date$</p>
        $endif$
      </div>
      $if(hero)$
      <div class="title-child-hero">
        <div class="title-hero">
          <img class="hero" src="$hero$" alt="">
        </div>
      </div>
      $endif$
    </div>

  </div>
</section>
