name: build
on:
  push:
    branches:
      - master
      - main

concurrency:
  # Serialize every workflow that writes to gh-pages.
  group: pages-${{ github.repository }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/quarto-dev/quarto:1.10.18
  TZ: Europe/Stockholm

jobs:
  quarto-render-job:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Define variables
        run: |
          output_dir=$(ruby -ryaml -e 'puts YAML.safe_load(File.read("_quarto.yml")).dig("project", "output-dir")')
          if [[ ! "${output_dir}" =~ ^[0-9]{4}$ ]] || (( 10#${output_dir:2:2} < 1 || 10#${output_dir:2:2} > 12 )); then
            echo "::error::project.output-dir must use the YYMM format with a valid month; got '${output_dir}'."
            exit 1
          fi
          {
            echo "OUTPUT_DIR=${output_dir}"
            echo "REPO=${GITHUB_REPOSITORY##*/}"
          } >> "${GITHUB_ENV}"
      - name: Check docker and variables
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "${PWD}:/work" "${{ env.IMAGE }}" quarto --version
          echo "GITHUB_ACTOR: ${GITHUB_ACTOR}"
          echo "GITHUB_REPOSITORY: ${GITHUB_REPOSITORY}"
          echo "GITHUB_WORKSPACE: ${GITHUB_WORKSPACE}"
          echo "REPO: ${REPO}"
          echo "OUTPUT_DIR: ${OUTPUT_DIR}"
          echo "GITHUB_REPOSITORY_OWNER: ${GITHUB_REPOSITORY_OWNER}"
      - name: Render site, pull repo, copy folder, create index, push repo
        run: |
          # Add git info
          git config --global user.email "do_not_email@example.com"
          git config --global user.name "gh_action"

          # Render website
          echo "Rendering qmd files ..."
          echo "PWD: ${PWD}"
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/work -v "/usr/share/zoneinfo/${TZ}:/etc/localtime:ro" -v "${PWD}:/work" "${{ env.IMAGE }}" quarto render /work

          # Clone gh-pages branch and remove old directories with same name
          git clone --depth 1 --single-branch --branch gh-pages "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" tmprepo
          if [[ -d "tmprepo/${OUTPUT_DIR}" ]]; then
            echo "Directory ${OUTPUT_DIR} already exists. Removing the directory."
            rm -rf -- "tmprepo/${OUTPUT_DIR}"
          fi
          cp -R "${OUTPUT_DIR}" tmprepo/
          cd tmprepo

          # Create index file
          cat > index.qmd <<'EOF'
          An introductory workshop on applied bioinformatic next-generation sequence analyses covering the followings major topics:

          - Working on the UNIX/LINUX command line
          - Bioinformatic/NGS data formats and QC
          - DNA variant calling workflow essentials
          - RNA sequence analysis workflow essentials

          <hr>

          Select a workshop instance below for more information.
          
          <div class='workshop-list'>
          EOF
          mapfile -t dirs < <(find . -maxdepth 1 -type d -regextype posix-extended -regex './[0-9]{4}' -printf '%f\n' | sort -r)
          for directory in "${dirs[@]}"; do
            month=${directory:2:2}
            if (( 10#${month} < 1 || 10#${month} > 12 )); then
              echo "::error::Directory '${directory}' does not contain a valid month."
              exit 1
            fi

            # This date calculation supports workshop directories from 2000 onward.
            printf -v date_spec '2000-01-01 +%s years +%s months -1 day' "${directory:0:2}" "${directory:2}"
            formatted_date=$(date -d "${date_spec}" +'%Y %b')
            printf "<div class='workshop-item'><span class='btn btn-tertiary'><a href='https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO}/${directory}/'>%s</a></span></div>\n" "${formatted_date}" >> index.qmd
          done
          printf '</div>\n' >> index.qmd

          # Render
          docker run --rm -u "$(id -u):$(id -g)" -e HOME=/work -v "/usr/share/zoneinfo/${TZ}:/etc/localtime:ro" -v "${PWD}:/work" "${{ env.IMAGE }}" quarto render /work/index.qmd

          # Push changes back
          git add --all
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Updated contents at $(date +%Y%m%d-%H%M%S)"
          git push origin
